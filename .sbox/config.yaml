version: 1
spec:
  adapter: openspec
  spec-box:
    config: .tms.json
    newFile: specs/{code}.spec-box.yml
  openspec:
    root: openspec
autonomy: supervised
gates:
  channels:
    - cli
  enabled:
    - proposal
    - plan
    - tests
runner:
  default: codex
  stateDir: ~/.sbox/runs
  timeoutMinutes: 120
  idleTimeoutMinutes: 20
  claude:
    permissionMode: acceptEdits
    allowedTools:
      - Read
      - Grep
      - Glob
      - Bash
      - Edit
      - Write
      - MultiEdit
      - NotebookEdit
    readOnlyTools:
      - Read
      - Grep
      - Glob
      - Bash
    profiles:
      simple:
        model: claude-sonnet-5
        effort: low
      medium:
        model: claude-sonnet-5
        effort: medium
      complex:
        model: claude-opus-5
        effort: high
  codex:
    executable: codex
    sandboxWrite: workspace-write
    sandboxRead: read-only
    approvalPolicy: on-request
    extraConfig: []
    profiles:
      simple:
        model: gpt-5.6-terra
        effort: low
      medium:
        model: gpt-5.6-terra
        effort: medium
      complex:
        model: gpt-5.6-sol
        effort: high
  roleProfiles:
    planner: complex
    challenger: complex
    reviewer: complex
repo:
  adapter: local
  baseBranch: master
  branchPrefix: sbox/
  github:
    apiUrl: https://api.github.com
    tokenEnv: GITHUB_TOKEN
changeset: {}
changes:
  dir: openspec/changes
project:
  docs: .sbox/project
testing:
  manualPlan: when-needed
  protectedGlobs: []
limits:
  returnsPerPhase: 3
  rejectionsPerPhase: 2
  maxRunsPerInvocation: 20
  packetFileChars: 4000
rules: {}
