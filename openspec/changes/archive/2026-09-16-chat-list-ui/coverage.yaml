# Связь утверждений спецификации с автотестами.
# capability → группа → утверждение → тесты | manual
#
# Автотестов по дельтам нет — по обеим capability изменения.
#
# 1. `plugins/telegram-chat-list/web-ui`: все утверждения описывают поведение раздела
#    веб-интерфейса в браузере. По testing.md в проекте нет тест-раннера для
#    `ThinkingHome.Plugins.*/frontend/**` (уровни «unit и component (TypeScript)» помечены «—»),
#    нет браузерных и e2e-тестов («Веб-интерфейс: разделы, тема, уведомления, SignalR —
#    браузерных тестов нет; проверять в браузере»). Серверной логики, проверяемой unit-тестом,
#    раздел не содержит: только регистрация страницы и ресурсы локализации
#    (design.md, «Стратегия проверки»).
# 2. `plugins/telegram-chat-list/http-api`: порядок ответа задаётся выборкой к БД
#    (`OrderByDescending(x => x.Date)` в `TelegramChatListWebApiPlugin.GetChatList`, design.md D3).
#    Уровень «component (C#, плагин с зависимостями)» в testing.md помечен «—»: инфраструктуры
#    для тестов с PostgreSQL в проекте нет. Уровень unit тоже неприменим: `GetChatList` —
#    приватный обработчик, он берёт сессию у `DatabasePlugin.OpenSession()`, а `DatabasePlugin` —
#    обычный класс с невиртуальным методом (подменить его моком нельзя) и требует строку
#    подключения к Npgsql. Проверить порядок «в памяти», не переписав продуктовую логику
#    в самом тесте, невозможно, поэтому утверждения проверяются запросом к работающему API.
#
# Ручные проверки по каждому утверждению — в test-plan.md.

"plugins/telegram-chat-list/http-api":
  "Список сохранённых чатов":
    "Запрос списка чатов":
      manual: "Состав ответа наблюдаем только у работающего ресурса: нужен запущенный хост с PostgreSQL и записями в TelegramChatList_Chat. Уровень «component (C#, плагин с зависимостями)» в testing.md помечен «—», unit неприменим (обработчик приватный, данные берутся через DatabasePlugin.OpenSession())."
    "Порядок записей в ответе":
      manual: "Порядок задаёт СУБД по ORDER BY из выборки (design.md, D3), поэтому проверяется запросом к API на живой базе с записями с разными датами. Тестов с PostgreSQL в проекте нет (testing.md, «Уровни тестов»), а проверка порядка без базы означала бы повтор продуктовой логики в тесте."
    "Отсутствующие значения полей":
      manual: "Нужна запись в TelegramChatList_Chat с NULL в Login, FirstName, LastName и ответ работающего ресурса; тестов с PostgreSQL и сериализации ответа в проекте нет (testing.md, «Уровни тестов», «Не автоматизируется»)."

"plugins/telegram-chat-list/web-ui":
  "Зависимость от HTTP API списка чатов":
    "Раздел использует HTTP API списка чатов":
      manual: "Проверяется запросом браузера к /api/telegram-chat-list/web-api/list при открытии раздела: нужен запущенный хост с PostgreSQL и инструменты разработчика браузера. Тест-раннера для frontend и браузерных тестов в проекте нет (testing.md, «Уровни тестов»)."
  "Раздел списка чатов":
    "Открытие списка чатов":
      manual: "Отображение таблицы со всеми полями записи о чате проверяется только в браузере: компонентных тестов TypeScript и e2e в проекте нет (testing.md, «Уровни тестов», «Не автоматизируется»)."
    "Отсутствие действий над чатами":
      manual: "Отсутствие элементов добавления, редактирования и удаления — свойство отрисованного интерфейса; браузерных тестов в проекте нет (testing.md, «Не автоматизируется»)."
  "Порядок вывода чатов":
    "Список выводится в порядке ответа API":
      manual: "Сравнение порядка строк таблицы с порядком записей в ответе API выполняется в браузере (вкладка «Сеть» плюс отрисованная таблица); тест-раннера для frontend и браузерных тестов в проекте нет (testing.md, «Уровни тестов»)."
    "Изменить порядок вывода нельзя":
      manual: "Отсутствие средств смены порядка (сортировки по клику на заголовок, переключателей) — свойство отрисованного интерфейса; браузерных тестов в проекте нет (testing.md, «Не автоматизируется»)."
  "Состояние пустого списка чатов":
    "Сообщение вместо пустого списка":
      manual: "Требует базы без записей о чатах и визуальной проверки раздела в браузере; браузерных тестов и фикстур БД в проекте нет (testing.md, «Среда e2e», «Не автоматизируется»)."
    "Пустой список не отображается":
      manual: "Отсутствие строки заголовков колонок при сохранённом заголовке раздела проверяется визуально в браузере; браузерных тестов в проекте нет (testing.md, «Не автоматизируется»)."
  "Отсутствующие значения полей чата":
    "Поле чата не заполнено":
      manual: "Нужна запись в TelegramChatList_Chat с NULL в полях login, firstName, lastName и визуальная проверка ячеек таблицы; компонентных и браузерных тестов в проекте нет (testing.md, «Уровни тестов»)."
  "Ошибка загрузки списка чатов":
    "Запрос списка чатов завершился ошибкой":
      manual: "Требует воспроизвести отказ HTTP API (запуск хоста без плагина TelegramChatList.WebApi) и увидеть всплывающее уведомление; уведомления веб-интерфейса в проекте не автоматизируются (testing.md, «Не автоматизируется»)."
  "Переход в раздел списка чатов с корневой страницы":
    "Переход на раздел с корневой страницы":
      manual: "Навигация по ссылке на корневой странице оболочки — браузерный сценарий; e2e-тестов в проекте нет (testing.md, «Среда e2e»)."
  "Локализация раздела списка чатов":
    "Раздел на русском языке":
      manual: "Требует хост с culture: ru-RU и проверку текстов в браузере: строки отдаются через /api/webui/lang и подставляются в компоненте; браузерных тестов в проекте нет (testing.md, «Не автоматизируется»)."
    "Сообщение о пустом списке на русском языке":
      manual: "Комбинация русской локали хоста и пустой таблицы чатов проверяется в браузере; браузерных тестов и фикстур БД в проекте нет (testing.md, «Среда e2e», «Не автоматизируется»)."
