accepted_gaps:
  - item: V12
    reason: Управляемые сценарии пустого ответа, ошибки, явной отмены и одновременных ошибок подписок недоступны без перехвата запросов, прокси или E2E-раннера. Изменение ограничено обратимым клиентским UI; статические ветви проверены по коду, типизация, сборка и доступные браузерные сценарии прошли. Остаточный риск средний.
  - item: G1
    reason: Среда не предоставляет способ подменить ответы API для всех сценариев пяти списков. Отдельные ветви состояний и локализованные сообщения присутствуют, а загрузка подписок агрегирована одним обработчиком ошибки и одним уведомлением. Риск принят как средний для локального обратимого изменения.
delivery_narrative:
  title: Показать состояния списков и увеличить заголовки шторок
  delta: Пять асинхронных списков теперь явно различают загрузку, данные, пустой результат, ошибку и предусмотренную отмену запроса, сохраняя заголовки и основные действия на экране. Редактор правил подписки показывает пустое состояние рядом с кнопкой добавления строки. Заголовки шторок заданий cron и подписок используют размер h2 из темы Mantine.
  why: Явные состояния устраняют неоднозначность пустого экрана и не позволяют одновременно показывать устаревшую таблицу и сообщение об ошибке. Загрузка данных подписок агрегирована через Promise.all, поэтому общий отказ создаёт одно уведомление. Стили шторок используют переменные темы Mantine и сохраняют существующую семантическую разметку.
  preserved: Сохранены маршруты, API-контракты, модели данных, доступные действия, семантический h2 с aria-labelledby, уведомления об ошибках и отмена запросов при размонтировании.
  rollout: Изменение поставляется обычной сборкой клиентских приложений с обновлённой прямой зависимостью Mantine для Tmp Web UI. Миграции данных, серверная конфигурация и изменения API не требуются.
  rollback: Для отката достаточно вернуть изменения клиентских компонентов, локализаций, зависимости Tmp Web UI и проектных соглашений; восстановление данных не требуется.
