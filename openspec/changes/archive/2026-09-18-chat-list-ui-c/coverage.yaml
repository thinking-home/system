# Связь утверждений спецификации с автотестами.
# capability → группа → утверждение → тесты | manual
#
# Все утверждения этого изменения помечены manual: изменение целиком лежит
# в зонах, где в проекте нет тестовой инфраструктуры (см. .sbox/project/testing.md):
# - серверная сортировка/выдача списка требует PostgreSQL и DatabasePlugin.OpenSession()
#   (component-тестов с реальной БД в проекте нет);
# - раздел веб-интерфейса и ссылка на корневой странице требуют браузера
#   (тест-раннера для frontend/** и e2e-тестов в проекте нет).
# design.md (раздел «Стратегия проверки») уже фиксирует это решение: для данного
# изменения планируются только `npx tsc` и `dotnet build`/`dotnet test` регрессии,
# без новых автотестов.

