delivery_narrative:
  title: Формы редактирования cron-задач и подписок на события открываются в выезжающей шторке
  delta: На /cron и /scripts/subscriptions форма добавления/редактирования раньше подменяла список на странице; теперь она всегда переносится в Drawer (@mantine/core, position="right"), который выезжает справа поверх страницы, а таблица и кнопка добавления остаются на месте постоянно. Заголовок шторки cron различает добавление ("Новая запись") и редактирование ("Редактирование задачи", новый ключ editTask в lang.ts и обоих .resx); шторка подписки шире (size="lg") под таблицу фильтра по meta. Сохранение/добавление и его успех или ошибка обрабатываются тем же кодом submit/fail, что и раньше, поэтому шторка закрывается только при подтверждённом сохранении и остаётся открытой при ошибке с уже введёнными данными; закрытие любым способом (отмена, крестик, Escape, клик вне шторки) сбрасывает форму через тот же resetForm. Отдельно на сервере HomePluginsMiddleware.cs теперь включает строку запроса в ключ кэша, поэтому /api/webui/lang и другие кэшируемые ресурсы с разными query-параметрами (например, id разных разделов) больше не путают ответы друг друга. Для выезжающей шторки во всех пяти UI-проектах поднята зависимость @thinking-home/ui до ^0.13.0 (обновлённый Mantine с рабочими порталами Drawer/Modal).
  why: Портал Drawer уже был доступен в используемой версии Mantine, вся смена — это перемещение существующей JSX-разметки формы под новый компонент-обёртку без изменения state-машины formVisible/editingId/resetForm/submit/fail, поэтому сохранённое и ранее протестированное поведение сохранения, ошибки и отмены работает без изменений логики. Уязвимость кэша устранена добавлением query string в существующий ключ — минимальное, локализованное изменение одной строки, не затрагивающее остальной алгоритм кэширования.
  preserved: Состав полей и порядок действий в обеих формах не изменились; таблица списка и кнопка добавления остаются видимыми всё время, как и раньше при закрытой форме; формат HTTP-ответов и заголовки Cache-Control не изменились; поведение некэшируемых ресурсов и ресурсов без строки запроса не изменилось.
  rollout: "Обычная выкладка сборки: dotnet build ThinkingHome.sln (два прохода, второй дособирает клиентские бандлы), миграций данных нет, серверный кэш в памяти сам заполнится заново после перезапуска процесса."
  rollback: "Откат коммитом: возврат версий @thinking-home/ui в пяти package.json/package-lock.json, tasks.tsx, subscriptions.tsx, ключа кэша в HomePluginsMiddleware.cs и новых лексических ключей — без данных для миграции назад."
