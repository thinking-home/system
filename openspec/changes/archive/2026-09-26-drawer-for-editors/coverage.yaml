# Связь утверждений спецификации с автотестами.
# capability → группа → утверждение → тесты | manual

plugins/web-server/http-resources:
  "Динамический ресурс генерируется на каждый запрос":
    "Запрос динамического ресурса вызывает обработчик":
      tests:
        - level: unit
          file: ThinkingHome.Tests/Plugins.WebServer/HomePluginsMiddlewareTests.cs
          name: "plugins/web-server/http-resources › Динамический ресурс генерируется на каждый запрос › Запрос динамического ресурса вызывает обработчик"
    "Некэшируемый динамический ресурс":
      tests:
        - level: unit
          file: ThinkingHome.Tests/Plugins.WebServer/HomePluginsMiddlewareTests.cs
          name: "plugins/web-server/http-resources › Динамический ресурс генерируется на каждый запрос › Некэшируемый динамический ресурс"
    "Кэшируемый ресурс с разными параметрами строки запроса":
      tests:
        - level: unit
          file: ThinkingHome.Tests/Plugins.WebServer/HomePluginsMiddlewareTests.cs
          name: "plugins/web-server/http-resources › Динамический ресурс генерируется на каждый запрос › Кэшируемый ресурс с разными параметрами строки запроса"
    "Повторный запрос с той же строкой запроса":
      tests:
        - level: unit
          file: ThinkingHome.Tests/Plugins.WebServer/HomePluginsMiddlewareTests.cs
          name: "plugins/web-server/http-resources › Динамический ресурс генерируется на каждый запрос › Повторный запрос с той же строкой запроса"

