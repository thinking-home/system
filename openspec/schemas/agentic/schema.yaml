name: agentic
version: 1
description: Стандартный процесс OpenSpec — proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Исходное предложение с описанием изменения
    template: proposal.md
    instruction: |-
      Создай предложение: объясни, ЗАЧЕМ нужно изменение, и определи его границы.

      - перед записью прочитай исходный запрос пользователя и используй его как принятый контекст;
      - предложение — документ согласования проблемы, границ и состава изменения;
      - если к разделу или подразделу нет применимой информации, укажи в нём «—».

      Не включай:
      - точные требования, поля контрактов и сценарии;
      - имена файлов, функций, классов и внутренних модулей (используй названия областей поведения);
      - внутренние структуры данных, детали хранения, алгоритмы и технические решения;
      - стратегию проверки и задачи реализации.

      ## Зачем

      - 1–3 предложения о проблеме или возможности;
      - какую проблему это решает;
      - почему сейчас.

      ## Границы изменения

      ### Входит

      - область изменения на высоком уровне;
      - ожидаемые результаты в границах изменения.

      ### Не входит

      - смежные результаты, которые явно остаются за пределами изменения.

      ## Функциональности

      - определи состав создаваемых и изменяемых функциональностей: этот раздел задаёт набор delta-спецификаций;
      - идентификатор функциональности — `<area>/<capability>` (например, `billing/invoice`, `auth/session`);
      - `<area>` — первый сегмент идентификатора, задающий предметную область;
      - `<capability>` — второй сегмент идентификатора, задающий устойчивую область поведения;
      - если изменяется поведение системы на уровне спецификаций, укажи хотя бы одну новую или изменяемую функциональность, не выдумывая её ради валидации;
      - если изменения поведения системы на уровне спецификаций нет, запиши `skip_specs: true` в конфигурационный файл изменения `.openspec.yaml`;

      ### Новые функциональности

      - перечисли вводимые функциональности;
      - оба сегмента идентификатора указывай в kebab-case, без пробелов;
      - для новой функциональности выбирай существующую area по смыслу;
      - новую area вводи только если ни одна из существующих не подходит;
      - именуй capability существительным в единственном числе, а не действием или глаголом;
      - определяй capability как целостную функциональную единицу, а не отдельную операцию или шаг.

      ### Изменяемые функциональности

      - перечисли существующие функциональности, у которых меняются требования;
      - включай только функциональности с изменением поведения на уровне спецификации, а не деталей реализации;
      - для каждой изменяемой функциональности потребуется delta-спецификация;
      - бери точные идентификаторы существующих функциональностей;
      - сохраняй исходную area изменяемой функциональности;
      - если меняется контракт существующей функциональности, укажи её среди изменяемых функциональностей.

      ## Внешнее влияние

      - перечисли затронутых внешних потребителей, публичные контракты и внешние зависимости;
      - несовместимые изменения публичных контрактов помечай меткой **BREAKING**;
      - фиксируй только сам факт и характер влияния, без нормативных требований и способов адаптации.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Подробные спецификации изменения
    template: spec.md
    instruction: |-
      Создай файлы спецификаций: определи, ЧТО должна делать система.

      - перед записью прочитай все завершённые зависимости и используй их как принятый контекст;
      - определяй наблюдаемый контракт поведения системы, предпочитая существующие спецификации деталям реализации в коде;
      - оставляй в файле delta-спецификации только применимые разделы шаблона.

      Не включай:
      - архитектурные и технические решения, внутренние структуры данных и алгоритмы;
      - задачи разработки, шаги исполнения и детали реализации в коде.

      ## Файлы функциональностей

      - создай отдельный файл для каждой функциональности, указанной в предложении;
      - путь к файлу: `specs/<area>/<capability>/spec.md`;
      - для новой функциональности используй идентификатор `<area>/<capability>` из предложения;
      - для изменяемой функциональности используй идентификатор из предложения, точно соответствующий существующей спецификации в `openspec/specs/<area>/<capability>/`;
      - если в предложении функциональности не указаны, не создавай файлы спецификаций.

      ## Purpose

      - заполняй только для новой функциональности;
      - опиши назначение в 1–2 содержательных предложениях (без TBD, не короче 50 символов).

      ## Операции

      Выбирай разделы по смыслу изменения:

      - RENAMED — тот же смысл, новый заголовок;
      - ADDED — требования ещё нет в постоянной спецификации;
      - MODIFIED — тот же смысл и неизменные заголовки сценариев, меняются утверждения или шаги сценариев;
      - REMOVED — требование исключается из спецификации;
      - REMOVED + ADDED — замена: меняется смысл либо нужно удалить, переименовать или объединить сценарии.

      ### RENAMED Requirements

      - используй только для существующих требований изменяемой функциональности;
      - пара FROM/TO задаёт переименование: заголовок FROM обязан точно совпадать с требованием в постоянной спецификации, а TO — быть уникальным;
      - если меняется только заголовок — укажи пару FROM/TO без добавления этого требования в MODIFIED, REMOVED или ADDED;
      - если меняются и заголовок, и поведение — укажи пару FROM/TO, а изменённое требование целиком опиши в MODIFIED под заголовком TO;
      - запрещено: указывать FROM в REMOVED, TO в ADDED, описывать требование в MODIFIED под старым заголовком FROM или дублировать один и тот же FROM или TO.

      ### ADDED Requirements

      - используй для новых требований как новой, так и изменяемой функциональности;
      - оформляй требования по правилам подраздела «Формат»;
      - при замене через REMOVED + ADDED формулируй полное требование под новым заголовком, отличным от удаляемого;
      - в новом требовании разрешается повторно использовать заголовки сценариев удалённого требования.

      ### MODIFIED Requirements

      - скопируй из постоянной спецификации полный блок требования от `### Requirement:` до конца сценариев, вставь в `## MODIFIED Requirements` и обнови утверждения или шаги сценариев;
      - сохраняй заголовок требования (а при одновременном переименовании — заголовок TO из пары RENAMED);
      - сохраняй без изменений все исходные заголовки `#### Scenario:` в том же количестве, а новое поведение описывай дополнительными сценариями;
      - если требуется удалить, переименовать или объединить сценарии — используй замену через REMOVED + ADDED;
      - не подменяй MODIFIED переименованием ради обхода ограничений на изменение сценариев;
      - если смысл сохраняется, а новый заголовок для REMOVED + ADDED нельзя обосновать, остановись и запроси решение пользователя.

      ### REMOVED Requirements

      - указывай заголовок требования в точности как в постоянной спецификации;
      - для каждого удаляемого требования заполни причину удаления и шаги миграции;
      - при замене через REMOVED + ADDED укажи прежнее требование здесь, а новое — в ADDED под другим заголовком;
      - delta-спецификация, состоящая только из REMOVED и снимающая все требования функциональности, допустима;
      - если блок REMOVED снимает все оставшиеся требования функциональности, запиши `retire_capabilities: true` в конфигурационный файл изменения `.openspec.yaml`.

      ## Формат

      ### Requirement

      - начинай каждое требование с заголовка `### Requirement: <название>`, за которым следует список нормативных утверждений;
      - каждое утверждение начинай с маркера `- **SHALL**` или `- **MUST NOT**`;
      - используй только нормативные маркеры SHALL и MUST NOT, без MUST, SHOULD и MAY;
      - после маркера пиши законченное предложение на русском языке со сказуемым в настоящем времени;
      - формулируй требования к наблюдаемому поведению системы;
      - каждое требование обязано содержать хотя бы один сценарий.

      ### Scenario

      - оформляй сценарии заголовками вида `#### Scenario: <название>`;
      - шаги сценария строй по шаблону **GIVEN** / **WHEN** / **THEN**, используя **AND** для продолжения предыдущего шага;
      - один сценарий проверяет одно поведение, предпочитай ровно один шаг с **WHEN**;
      - описывай поведение системы с точки зрения пользователя или внешнего контракта.

      ## Примеры

      Новая функциональность:

      ```
      ## Purpose

      Функциональность позволяет пользователям получать свои данные в переносимом формате.

      ## ADDED Requirements

      ### Requirement: Пользователь может экспортировать данные

      - **SHALL** система позволяет пользователю экспортировать свои данные в формате CSV.
      - **MUST NOT** экспорт содержит секреты аутентификации.

      #### Scenario: Успешный экспорт

      - **GIVEN** пользователь авторизован
      - **AND** имеет право на экспорт
      - **WHEN** пользователь выбирает формат CSV
      - **AND** нажимает кнопку «Экспорт»
      - **THEN** система загружает CSV-файл
      - **AND** файл содержит все данные пользователя
      - **AND** файл не содержит секретов аутентификации
      ```

      Переименование и изменение поведения:

      ```
      ## RENAMED Requirements

      - FROM: `### Requirement: Пользователь может экспортировать данные`
      - TO: `### Requirement: Пользователь может экспортировать данные в CSV`

      ## MODIFIED Requirements

      ### Requirement: Пользователь может экспортировать данные в CSV

      - **SHALL** система позволяет пользователю экспортировать свои данные в формате CSV.
      - **SHALL** система записывает событие аудита при каждом экспорте.

      #### Scenario: Успешный экспорт

      - **GIVEN** пользователь авторизован
      - **AND** имеет право на экспорт
      - **WHEN** пользователь выбирает формат CSV
      - **AND** нажимает кнопку «Экспорт»
      - **THEN** система загружает CSV-файл
      - **AND** система записывает событие аудита
      ```
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Технический проект с деталями реализации
    template: design.md
    instruction: |-
      Создай технический проект: объясни, КАК реализовать изменение.

      - перед записью прочитай все завершённые зависимости и используй их как принятый контекст;
      - сосредоточься на архитектуре, выбранном подходе и причинах технического выбора;
      - фиксируй только новую информацию о способе реализации, не дублируя предыдущие артефакты;
      - если к разделу нет применимой информации, укажи в нём «—».

      Не включай:
      - мотивацию, границы, требования и BDD-сценарии из зависимостей;
      - задачи разработки, чек-листы и шаги исполнения (оставь для tasks);
      - построчную реализацию и объёмные листинги кода.

      ## Технический контекст

      - приведи факты текущей реализации, которые влияют на выбор и не зафиксированы в зависимостях;
      - описывай существующее состояние системы и кодовой базы, а не требования к будущей реализации.

      ## Ограничения

      - перечисли технические условия, которым обязана соответствовать реализация: стек технологий, совместимость, производительность, требования к эксплуатации.

      ## Решения

      - опиши ключевые архитектурные и технические решения;
      - проектируй решение с учётом всей цепочки затронутых контрактов, предпочитая существующие спецификации деталям реализации в коде;
      - для каждого решения заполни подразделы: само решение, обоснование, рассмотренные альтернативы и последствия;
      - если существующая зависимость ограничивает решение, сузь рамки решения либо явно спроектируй изменение этой зависимости.

      ## Риски / Компромиссы

      - перечисли известные технические риски, возможные проблемы и архитектурные компромиссы;
      - оформляй каждый пункт в формате «риск → мера снижения».

      ## План миграции и отката

      - опиши шаги применения изменений (миграция данных, конфигурация, выкатка) и процедуру отката к предыдущему состоянию.

      ## Стратегия проверки

      - определи подход к проверке решений и контрактов: укажи, что и на каких уровнях тестирования проверяется (модульные, интеграционные тесты, статический анализ);
      - подтверждай новое или изменённое поведение системы, одного отсутствия регрессий в существующих тестах недостаточно;
      - не превращай раздел в чек-лист конкретных задач (оставь их для tasks).

      ## Открытые вопросы

      - фиксируй только те некритичные вопросы, которые можно отложить без изменения требований, выбранного подхода или состава задач;
      - если открытый вопрос влияет на требования или архитектурный выбор, запроси решение пользователя до записи артефакта.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Проверяемый список задач реализации
    template: tasks.md
    instruction: |-
      Создай список задач: разбей работу по реализации на проверяемые шаги.

      - перед записью прочитай все завершённые зависимости и используй их как принятый контекст;
      - объединяй связанные задачи в логические группы под нумерованными заголовками `##`;
      - оформляй каждую задачу флажком `- [ ] X.Y Описание задачи` (задачи без `- [ ]` не отслеживаются);
      - упорядочивай задачи по зависимостям: от подготовительных шагов к основной реализации и проверкам;
      - формулируй задачи атомарно и проверяемо: объём задачи должен укладываться в одну сессию, а критерий выполнения — быть однозначным;
      - в каждой задаче на реализацию ссылайся на требование или сценарий либо явно помечай её как техническую или вспомогательную;
      - включай задачи на прямую проверку каждого нового или изменённого контракта (одного отсутствия регрессий в существующих тестах недостаточно);
      - добавляй задачи на проверку изменённого кода согласно инструкциям проекта (тесты, типы, линтеры и любые другие обязательные проверки).

      Не включай:
      - новые требования, функциональности или сценарии;
      - пересмотр архитектурного выбора и технических решений;
      - задачи на ручную проверку и любые шаги, требующие участия человека.

      Пример:

      ```
      ## 1. Подготовка

      - [ ] 1.1 Создать структуру нового модуля
      - [ ] 1.2 Добавить зависимости в package.json

      ## 2. Основная реализация

      - [ ] 2.1 Реализовать экспорт данных
      - [ ] 2.2 Добавить средства форматирования CSV
      ```
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |-
    Выполни утверждённый план изменения.

    - используй артефакты изменения как источник требований, технических решений и плана реализации;
    - выполняй задачи из tasks.md последовательно, с учётом зависимостей между ними;
    - отмечай задачу выполненной (флажком `- [x]`) только после фактической реализации и проверки;
    - не изменяй другие артефакты изменения — отметка выполненных задач в tasks.md является единственной допустимой правкой;
    - при возникновении невыполнимых задач, непреодолимых препятствий или расхождений с планом остановись, не переопределяя план самостоятельно.
