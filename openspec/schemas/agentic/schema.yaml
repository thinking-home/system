name: agentic
version: 1
description: Стандартный процесс OpenSpec — proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Исходное предложение с описанием изменения
    template: proposal.md
    instruction: |
      Создай предложение: объясни, ЗАЧЕМ нужно изменение, и определи его границы.

      ## Зачем

      - 1–2 предложения о проблеме или возможности;
      - какую проблему это решает;
      - почему сейчас.

      ## Границы изменения

      ### Входит

      - область изменения на высоком уровне;
      - ожидаемые результаты в границах изменения.

      ### Не входит

      - смежные результаты, которые явно остаются за пределами изменения.

      ## Функциональности

      - укажи, какие спецификации будут созданы или изменены: этот раздел определяет набор delta-спецификаций;
      - нет изменения поведения на уровне спецификаций — оставь оба подраздела пустыми и запиши `skip_specs: true` в `.openspec.yaml` изменения;
        - иначе укажи хотя бы одну новую или изменяемую функциональность, но не выдумывай её ради валидации;
      - источник существующих id и area — `npx openspec list --specs`;
      - пиши кратко, сосредоточься на мотивации, границах и карте функциональностей.

      ### Новые функциональности

      - перечисли вводимые функциональности;
      - идентификатор — `<area>/<capability>` (например, `billing/invoices`, `auth/sessions`);
      - оба сегмента в kebab-case, без пробелов;
      - `<capability>` — устойчивая область поведения или контракта, а не способ реализации;
      - `<area>` — первый сегмент id из этого списка;
      - для новой функциональности выбери существующую area по смыслу;
      - новую area вводи только если ни одна не подходит;
      - сверяй area и занятые id с этим списком;
      - не создавай area или capability только для именования реестра, адаптера, фабрики, внутреннего модуля или рефакторинга.

      ### Изменяемые функциональности

      - перечисли существующие функциональности, у которых меняются требования;
      - включай только изменение поведения на уровне спецификации, не деталей реализации;
      - для каждой нужна delta-спека;
      - бери точные id из этого списка;
      - для изменяемой функциональности сохрани её area;
      - если меняется контракт существующей функциональности, укажи её как изменяемую;
      - оставь раздел пустым, если требования не меняются.

      ## Внешнее влияние

      - карта затронутых потребителей, публичных контрактов и внешних зависимостей;
      - несовместимость помечай **BREAKING**;
      - здесь только сигнал влияния, без нормативного поведения и способа адаптации;
      - упоминай идентификатор публичного контракта только когда без него нельзя обозначить влияние;
      - имена файлов, функций, классов и внутренних модулей заменяй названием области поведения.

      Не включай:

      - точные требования, поля контрактов и сценарии;
      - внутренние структуры данных;
      - алгоритмы, технические решения, альтернативы и детали хранения;
      - стратегию проверки и задачи реализации.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Подробные спецификации изменения
    template: spec.md
    instruction: |
      Создай файлы спецификаций: определи, ЧТО должна делать система.

      - перед записью прочитай все завершённые зависимости и используй их как принятый контекст;
      - оставь в delta-файле только применимые разделы шаблона;
      - спека — наблюдаемый контракт поведения, а не план реализации.

      ## Файлы функциональностей

      - создай по одному файлу для каждой функциональности из завершённых зависимостей;
      - идентификатор — `<area>/<capability>`;
      - путь: `specs/<area>/<capability>/spec.md`;
      - для новой бери id из proposal, для изменяемой зеркаль `openspec/specs/<area>/<capability>/`;
      - не сокращай id и не используй плоский путь `specs/<capability>/spec.md`;
      - если в зависимостях нет функциональностей — не создавай файлы и не выдумывай требования.

      ## Purpose

      - только для новой функциональности, в начале её delta-файла;
      - одно-два содержательных предложения без TBD, не короче 50 символов;
      - в delta изменяемой функциональности `## Purpose` не добавляй.

      ## Операции

      Выбери разделы по смыслу изменения:

      - RENAMED — тот же смысл, новый заголовок;
      - ADDED — требования ещё нет в постоянной спецификации;
      - MODIFIED — тот же смысл и те же заголовки сценариев, меняется содержимое;
      - REMOVED — требование уходит;
      - REMOVED + ADDED — замена: меняется смысл либо нужно удалить, переименовать или объединить сценарии.

      Не подменяй MODIFIED формальным переименованием ради обхода проверки сценариев. Если смысл сохраняется, а новый заголовок для REMOVED + ADDED нельзя обосновать — остановись и запроси решение.

      ### RENAMED Requirements

      - только для существующей спеки в `openspec/specs/`;
      - формат: `- FROM: \`### Requirement: <старое имя>\`` и `- TO: \`### Requirement: <новое имя>\``;
      - FROM совпадает с постоянной спецификацией точно, TO ещё не занят;
      - только имя — одна пара FROM/TO, без MODIFIED, REMOVED и ADDED для этого требования;
      - имя и содержимое — пара FROM/TO плюс полный блок в MODIFIED под TO;
      - запрещено: FROM в REMOVED, TO в ADDED, MODIFIED под FROM, повтор одного FROM или TO.

      ### ADDED Requirements

      - новые требования новой или изменяемой функциональности;
      - оформляй по разделу «Формат»;
      - при замене (REMOVED + ADDED) пиши полное новое требование под заголовком, отличным от удалённого;
      - заголовки сценариев удалённого требования можно переиспользовать как новые.

      ### MODIFIED Requirements

      - скопируй из постоянной спецификации весь блок от `### Requirement:` до конца сценариев;
      - вставь в `## MODIFIED Requirements` и обнови утверждения и тела сценариев;
      - заголовок требования сохрани, при RENAMED — TO;
      - каждый заголовок `#### Scenario:` из постоянной спецификации сохрани без изменений и столько же раз;
      - новое поведение добавляй отдельными сценариями;
      - не удаляй, не переименовывай и не объединяй существующие сценарии через MODIFIED — для этого REMOVED + ADDED.

      ### REMOVED Requirements

      - заголовок точно как в постоянной спецификации;
      - для каждого укажи `**Причина**` и `**Миграция**`;
      - при замене (REMOVED + ADDED) укажи прежнее требование здесь, новое — в ADDED под другим заголовком;
      - REMOVED-only delta, которая снимает все требования функциональности, допустима;
      - если REMOVED снимает все оставшиеся требования функциональности — запиши `retire_capabilities: true` в `.openspec.yaml` изменения.

      ## Формат

      ### Requirement

      - для ADDED и MODIFIED: `### Requirement: <name>`, затем список утверждений;
      - каждое утверждение — `- **SHALL**` или `- **MUST NOT**` в начале пункта;
      - после маркера — русское предложение со спрягаемым глаголом в настоящем времени;
      - используй только SHALL и MUST NOT, без MUST, SHOULD, MAY;
      - описывай наблюдаемое поведение, не механизм реализации;
      - в каждом требовании — хотя бы один сценарий.

      ### Scenario

      - заголовок ровно `#### Scenario: <name>`;
      - GIVEN / WHEN / THEN, **AND** продолжает предыдущий шаг;
      - один сценарий — одно поведение, предпочитай один WHEN;
      - не переписывай существующий сценарий только ради GIVEN/WHEN/THEN;
      - описывай поведение системы, не детали реализации.

      ## Примеры

      Новая функциональность:

      ```
      ## Purpose

      Функциональность позволяет пользователям получать свои данные в переносимом формате.

      ## ADDED Requirements

      ### Requirement: Пользователь может экспортировать данные

      - **SHALL** система позволяет пользователю экспортировать свои данные в формате CSV.
      - **MUST NOT** экспорт содержит секреты аутентификации.

      #### Scenario: Успешный экспорт

      - **GIVEN** пользователь авторизован
      - **AND** имеет право на экспорт
      - **WHEN** пользователь выбирает формат CSV
      - **AND** нажимает кнопку «Экспорт»
      - **THEN** система загружает CSV-файл
      - **AND** файл содержит все данные пользователя
      - **AND** файл не содержит секретов аутентификации
      ```

      Переименование и изменение поведения:

      ```
      ## RENAMED Requirements

      - FROM: `### Requirement: Пользователь может экспортировать данные`
      - TO: `### Requirement: Пользователь может экспортировать данные в CSV`

      ## MODIFIED Requirements

      ### Requirement: Пользователь может экспортировать данные в CSV

      - **SHALL** система позволяет пользователю экспортировать свои данные в формате CSV.
      - **SHALL** система записывает событие аудита при каждом экспорте.

      #### Scenario: Успешный экспорт

      - **GIVEN** пользователь авторизован
      - **AND** имеет право на экспорт
      - **WHEN** пользователь выбирает формат CSV
      - **AND** нажимает кнопку «Экспорт»
      - **THEN** система загружает CSV-файл
      - **AND** система записывает событие аудита
      ```
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Технический проект с деталями реализации
    template: design.md
    instruction: |
      Создай технический проект: объясни, КАК реализовать изменение.

      - перед записью прочитай все завершённые зависимости и используй их как принятый контекст;
      - не повторяй мотивацию, границы, требования, сценарии и ожидаемые результаты изменения;
      - сосредоточься на архитектуре и подходе, а не на построчной реализации;
      - артефакт должен содержать новую информацию о способе реализации и причинах технического выбора.

      ## Технический контекст

      - факты текущей реализации, которые влияют на выбор и ещё не зафиксированы в зависимостях;
      - описывай существующее состояние, а не требования к будущей реализации.

      ## Ограничения

      - технические условия, которым обязана соответствовать реализация: стек, совместимость, производительность, эксплуатация.

      ## Решения

      - ключевые технические решения;
      - для каждого укажи само решение, обоснование, рассмотренные альтернативы и последствия;
      - проверяй заявленные свойства решения по всей цепочке затронутых и сохраняемых контрактов;
      - если неизменяемая зависимость ограничивает расширяемость или обобщённость решения — сузь обещание либо включи изменение этого контракта в проект.

      ## Риски / Компромиссы

      - известные ограничения и возможные проблемы;
      - формат: [Риск] → Мера снижения.

      ## План миграции и отката

      - шаги перехода и возврата, если применимо.

      ## Стратегия проверки

      - виды доказательств и подход к подтверждению контракта и решений;
      - что и на каком уровне проверять;
      - не превращай раздел в чеклист исполняемых шагов;
      - стратегия должна непосредственно доказывать новый или изменённый контракт;
      - одного отсутствия регрессий в существующих сценариях недостаточно.

      ## Открытые вопросы

      - только неизвестные, которые можно отложить без изменения требований, выбранного подхода и состава задач;
      - если вопрос влияет на них — запроси решение пользователя до записи артефакта.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Проверяемый список задач реализации
    template: tasks.md
    instruction: |
      Создай список задач, разбивающий работу по реализации.

      - перед записью прочитай все завершённые зависимости и используй их как источник требований и выбранного способа реализации;
      - точно следуй шаблону: формат флажков используется для отслеживания выполнения;
      - объединяй связанные задачи под нумерованными заголовками `##`;
      - оформляй каждую задачу флажком `- [ ] X.Y Описание задачи`;
      - задачи без `- [ ]` не отслеживаются;
      - задачи должны быть достаточно малы, чтобы выполнить их за одну сессию;
      - упорядочивай задачи по зависимостям: сначала то, что необходимо для последующей работы;
      - каждая задача на реализацию должна ссылаться на требование или сценарий либо быть явно помечена как техническая или вспомогательная;
      - для каждого нового или изменённого контракта включай прямую проверку заявленного свойства;
      - существующие регрессионные проверки сами по себе недостаточны;
      - не добавляй новых требований и не пересматривай технические решения — только план исполнения;
      - каждая задача должна быть проверяемой: должно быть понятно, когда она выполнена.

      Пример:

      ```
      ## 1. Подготовка

      - [ ] 1.1 Создать структуру нового модуля
      - [ ] 1.2 Добавить зависимости в package.json

      ## 2. Основная реализация

      - [ ] 2.1 Реализовать экспорт данных
      - [ ] 2.2 Добавить средства форматирования CSV
      ```
    requires:
      - specs
      - design

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Выполни утверждённый план изменения.

    - контекстные файлы задают требования и принятый способ реализации;
    - выполняй ожидающие рабочие пункты в порядке их зависимостей;
    - отмечай пункт завершённым только после фактического выполнения и проверки;
    - отметка готовности — единственная допустимая правка планирующих артефактов на этом этапе;
    - при блокере остановись и не переопределяй план по ходу.
